name: Publish EPUB and AZW3 Monthly

on:
    push:
        branches: [main]
    schedule:
        - cron: "0 0 1 * *"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright

        steps:
            - name: Get current date
              id: date
              run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
              with:
                  version: 10
                  dest: ${{ github.workspace }}/.cache/pnpm
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 25
                  cache: pnpm
            - run: pnpm install --frozen-lockfile --ignore-scripts --store-dir .cache/pnpm-store
            - run: pnpm exec playwright install chromium
            - name: Stage Calibre runtime libraries without system installation
              run: |
                  mkdir -p .cache/calibre-debs .cache/calibre-libs
                  (cd .cache/calibre-debs && apt download libegl1 libopengl0 libglvnd0)
                  for deb in .cache/calibre-debs/*.deb; do
                    dpkg-deb -x "$deb" .cache/calibre-libs
                  done
                  echo "LD_LIBRARY_PATH=$PWD/.cache/calibre-libs/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
            - name: Install Calibre in isolated project cache
              run: |
                  mkdir -p .cache/calibre
                  curl --fail --location --show-error --silent \
                    --output .cache/calibre-installer.sh \
                    https://download.calibre-ebook.com/linux-installer.sh
                  sh .cache/calibre-installer.sh "install_dir=$PWD/.cache/calibre" isolated=y version=9.15.0
            - name: Build and validate every ebook
              env:
                  CI: true
              run: sh scripts/ci-ebooks.sh all
            - name: Publish EPUB and AZW3 release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  gh release create "release-${{ steps.date.outputs.date }}-${{ github.run_number }}" \
                    output/ebooks/*/*.epub output/ebooks/*/*.azw3 \
                    --target "$GITHUB_SHA" \
                    --title "EPUB and AZW3 ${{ steps.date.outputs.date }}" \
                    --notes "Generated from the books' official print pages. EPUB styling and internal links validated. External links require internet; unavailable Rust RFC source diagrams appear as labeled links."
