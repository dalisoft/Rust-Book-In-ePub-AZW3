name: Publish EPUB and AZW3 When Sources Change

on:
    push:
        branches: [main]
    schedule:
        # Daily at 09:00 GMT+5 (04:00 UTC).
        - cron: "0 4 * * *"
    workflow_dispatch:
        inputs:
            force_rebuild:
                description: Rebuild all books without reusing release artifacts
                type: boolean
                default: false

permissions:
    contents: write

concurrency:
    group: ebook-release
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-24.04
        env:
            PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
            BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.cache/bun-cache

        steps:
            - name: Get current date
              id: date
              run: echo "date=$(TZ=Asia/Samarkand date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26
                  package-manager-cache: false
            - name: Stage verified Bun binary inside the project
              run: |
                  mkdir -p .cache/bun
                  curl --fail --location --show-error --silent \
                    --output .cache/bun/bun-linux-x64.zip \
                    https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/bun-linux-x64.zip
                  echo '36368faef7527875d5ffa52e53cd48021741f2a83eb6208a8dd64068d422a913  .cache/bun/bun-linux-x64.zip' | sha256sum --check
                  unzip -q .cache/bun/bun-linux-x64.zip -d .cache/bun
                  rm -- .cache/bun/bun-linux-x64.zip
                  .cache/bun/bun-linux-x64/bun --version
                  echo "$PWD/.cache/bun/bun-linux-x64" >> "$GITHUB_PATH"
            - run: bun ci --ignore-scripts
            - run: bun run test:cache
            - name: Hash sources and restore unchanged books from the latest release
              id: sources
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  mkdir -p .cache/source-check
                  baseline=()
                  if [ "${{ inputs.force_rebuild }}" != true ] && gh api "repos/$GH_REPO/releases/latest" > .cache/source-check/latest-release.json; then
                    tag=$(jq -r .tag_name .cache/source-check/latest-release.json)
                    if jq -e '.assets[] | select(.name == "source-fingerprints.json")' .cache/source-check/latest-release.json >/dev/null; then
                      gh release download "$tag" --pattern source-fingerprints.json --dir .cache/source-check
                      baseline=(--baseline=.cache/source-check/source-fingerprints.json --release=.cache/source-check/latest-release.json)
                    fi
                  fi
                  node scripts/check-source-updates.ts \
                    --output=.cache/source-check/current-source-fingerprints.json \
                    --plan=.cache/source-check/build-plan.json \
                    --source-dir=.cache/source-inputs \
                    --output-dir=output/ebooks \
                    "${baseline[@]}" >> "$GITHUB_OUTPUT"
            - if: steps.sources.outputs.build_required == 'true'
              run: ./node_modules/.bin/playwright install chromium
            - name: Stage Calibre runtime libraries without system installation
              if: steps.sources.outputs.build_required == 'true'
              run: |
                  mkdir -p .cache/calibre-debs .cache/calibre-libs
                  (cd .cache/calibre-debs && apt download \
                    libegl1 libopengl0 libglvnd0 \
                    libxcb-cursor0 libxcb-image0 libxcb-render-util0 libxcb-util1 \
                    libxcb-xinerama0 libxkbcommon-x11-0)
                  for deb in .cache/calibre-debs/*.deb; do
                    dpkg-deb -x "$deb" .cache/calibre-libs
                  done
                  LD_LIBRARY_PATH="$PWD/.cache/calibre-libs/usr/lib/x86_64-linux-gnu" \
                    ldd .cache/calibre-libs/usr/lib/x86_64-linux-gnu/libxcb-cursor.so.0
                  echo "LD_LIBRARY_PATH=$PWD/.cache/calibre-libs/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
            - name: Install Calibre in isolated project cache
              if: steps.sources.outputs.build_required == 'true'
              run: |
                  mkdir -p .cache/calibre
                  curl --fail --location --show-error --silent \
                    --output .cache/calibre-installer.sh \
                    https://download.calibre-ebook.com/linux-installer.sh
                  version=$(jq -r .converterVersion scripts/ebook-toolchain.json)
                  sh .cache/calibre-installer.sh "install_dir=$PWD/.cache/calibre" isolated=y "version=$version"
            - name: Build changed books and verify cached release formats
              if: steps.sources.outputs.changed == 'true'
              env:
                  CI: true
                  BOOK_BUILD_WORKERS: 4
                  BOOK_BUILD_PLAN: .cache/source-check/build-plan.json
              run: sh scripts/ci-ebooks.sh all
            - name: Publish EPUB and AZW3 release
              if: steps.sources.outputs.changed == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  tag="release-${{ steps.date.outputs.date }}"
                  mapfile -t files < .cache/source-check/release-files.txt
                  files+=(.cache/source-check/source-fingerprints.json)
                  for attempt in 1 2 3; do
                    if gh release view "$tag" >/dev/null 2>&1; then
                      gh release upload "$tag" "${files[@]}" --clobber || true
                    else
                      gh release create "$tag" "${files[@]}" \
                        --target "$GITHUB_SHA" \
                        --title "EPUB and AZW3 ${{ steps.date.outputs.date }}" \
                        --notes "Generated from the books' official print pages. EPUB styling and internal links validated. External links require internet; unavailable Rust RFC source diagrams appear as labeled links." || true
                    fi
                    if gh api "repos/$GH_REPO/releases/tags/$tag" > .cache/source-check/published-release.json &&
                       node scripts/verify-release-cache.ts .cache/source-check/source-fingerprints.json .cache/source-check/published-release.json; then
                      exit 0
                    fi
                    sleep "$((attempt * 10))"
                  done
                  echo "Release upload did not pass complete asset hash verification" >&2
                  exit 1
